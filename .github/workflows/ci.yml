name: ask-ai CI

on:
  push:
    branches: ["master", "main", "feat/**"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pytest pytest-cov ruff build twine mypy
      - name: Lint with Ruff
        run: ruff check .
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m pytest -q --cov=ask_ai --cov-report=term-missing --cov-report=xml
      - name: Test with pytest
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: python -m pytest -q
      - name: Type-check with mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: mypy ask_ai/providers/openai_compatible_provider.py --ignore-missing-imports --follow-imports=silent
      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install wheel in a fresh environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import ask_ai; print(ask_ai.__version__)"
          "$RUNNER_TEMP/wheel-smoke/bin/ask-ai" --version

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install package and pip-audit
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[all]" pip-audit
      - name: Audit dependencies
        run: pip-audit
