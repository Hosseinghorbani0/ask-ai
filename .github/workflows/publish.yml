name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to publish
        required: true
        type: string
      allow_prerelease:
        description: Allow publishing a prerelease to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release_info:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      published: ${{ steps.release.outputs.published }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Verify published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "published=$(jq -r '.published_at != null' <<< "$release")" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.draft' <<< "$release")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r '.prerelease' <<< "$release")" >> "$GITHUB_OUTPUT"

  test:
    needs: release_info
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release_info.outputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pytest ruff build twine
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import ask_ai; print(ask_ai.__version__)"
          "$RUNNER_TEMP/wheel-smoke/bin/ask-ai" --version

  deploy:
    needs: [release_info, test]
    if: >-
      needs.release_info.outputs.published == 'true' &&
      needs.release_info.outputs.draft == 'false' &&
      (
        needs.release_info.outputs.prerelease == 'false' ||
        (github.event_name == 'workflow_dispatch' && inputs.allow_prerelease)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release_info.outputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
